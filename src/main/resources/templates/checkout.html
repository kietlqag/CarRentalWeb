<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Checkout | Car Rental</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/assets/index.css}">
</head>
<body>

<div class="container checkout-container">
  <h2 class="mb-4 text-center">Xác Nhận Đặt Xe</h2>

  <div class="row">
    <!-- Left Side: Customer Info -->
    <div class="col-md-7">
      <h5 class="section-title">Thông Tin Khách Hàng</h5>
      <form id="bookingForm">
        <div class="mb-3">
          <label class="form-label">Họ và tên</label>
          <input type="text" class="form-control" placeholder="Nhập họ tên"
                 th:value="${account != null} ? ${account.getFullName()} : ''" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Địa chỉ Gmail"
                 th:value="${account != null} ? ${account.getEmail()} : ''" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Số điện thoại</label>
          <input type="tel" class="form-control" placeholder="Số điện thoại"
                 th:value="${account != null} ? ${account.getPhone()} : ''" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Địa điểm nhận xe</label>
          <input type="text" class="form-control" placeholder="Nhập địa điểm"
                 th:value="${account != null} ? ${account.getAddress()} : ''" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Ghi chú</label>
          <textarea class="form-control" rows="3" placeholder="Ghi chú thêm..."></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Khuyến mãi</label>
          <select class="form-select" id="discountSelect">
            <option value="0" selected>Không áp dụng</option>
            <option value="10">Giảm 10% - Khách hàng thân thiết</option>
            <option value="20">Giảm 20% - Ưu đãi tháng 5</option>
            <option value="15">Giảm 15% - Đặt sớm</option>
          </select>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="termsCheck" required>
          <label class="form-check-label" for="termsCheck">Tôi đồng ý với Chính sách và Điều khoản dịch vụ</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Thanh toán</button>
      </form>
    </div>

    <!-- Right Side: Summary -->
    <div class="col-md-5">
      <h5 class="section-title">Tóm Tắt Đặt Xe</h5>
      <div class="summary-box">
        <img id="summaryImage" th:src="${car.image}" class="mb-3" alt="Ảnh xe">
        <h4 id="summaryCarName" th:text="${car.getName()}">Toyota Land Cruiser (2022)</h4>
        <p><strong>Dịch vụ:</strong>
          <span id="summaryService"
                th:text="${service != null ? service.getNameService() : ''}">Airport Transfer</span>
        </p>
        <p><strong>Ngày nhận:</strong>
          <span id="summaryDate" th:text="${#temporals.format(startDate, 'dd/MM/yyyy')}">12/06/2025</span>
        </p>
        <p><strong>Ngày trả:</strong>
          <span id="summaryPeriod" th:text="${#temporals.format(endDate, 'dd/MM/yyyy')}">14/06/2025</span>
        </p>

        <p><strong>Số ngày thuê:</strong>
          <span id="summaryDays" th:text="${countdate}">2 ngày</span>
        </p>
        <hr>
        <h5 class="text-primary">Tổng tiền: <span id="summaryTotal" th:text="${total}">3.300.000đ</span></h5>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
